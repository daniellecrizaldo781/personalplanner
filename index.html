<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danielle's Planner</title>
  <meta name="description" content="Danielle's personal productivity dashboard with tasks, notes, meetings, and team cascades">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- Top Decorative Banner -->
  <div class="top-banner">
    <img src="assets/img/chibi-heart.svg" alt="Heart" class="chibi-sticker chibi-heart">
    <img src="assets/img/chibi-butterfly.svg" alt="Butterfly" class="chibi-sticker chibi-butterfly">
  </div>

  <div class="app-container">
    <!-- Top Navigation Bar (moved from sidebar) -->
    <nav class="top-navbar" id="top-navbar">
      <div class="top-navbar-header">
        <div class="top-navbar-title-row">
          <img src="assets/img/chibi-heart.svg" alt="Heart" class="nav-chibi" width="32" height="32">
          <h2 class="top-navbar-title">Danielle's Planner</h2>
        </div>
        <button class="btn btn-sm nav-toggle d-lg-none" id="nav-toggle">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="top-navbar-nav" id="top-navbar-nav">
        <a href="#" class="nav-link active" data-page="dashboard">
          <i class="bi bi-speedometer2"></i> Dashboard
        </a>
        <a href="#" class="nav-link" data-page="tasks">
          <i class="bi bi-clipboard-task"></i> My Tasks
        </a>
        <a href="#" class="nav-link" data-page="completed">
          <i class="bi bi-check-circle"></i> Completed Tasks
        </a>
        <a href="#" class="nav-link" data-page="notes">
          <i class="bi bi-journal-richtext"></i> Important Notes
        </a>
        <a href="#" class="nav-link" data-page="meetings">
          <i class="bi bi-people"></i> Meeting Notes
        </a>
        <a href="#" class="nav-link" data-page="cascades">
          <i class="bi bi-megaphone"></i> Team Cascades
        </a>
        <a href="#" class="nav-link" data-page="settings">
          <i class="bi bi-gear"></i> Settings
        </a>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <div class="top-bar">
        <div class="d-flex align-items-center">
          <button class="btn btn-sm nav-toggle d-lg-none me-3" id="nav-open">
            <i class="bi bi-list"></i>
          </button>
          <h1 class="page-title" id="page-title">Dashboard</h1>
        </div>
        <div class="d-flex align-items-center gap-3">
          <div class="position-relative" id="global-search-container">
            <input type="text" class="form-control form-control-sm" id="global-search" placeholder="Global search...">
            <div class="global-search-dropdown" id="global-search-dropdown"></div>
          </div>
          <button class="btn btn-sm btn-outline-secondary" id="theme-toggle">
            <i class="bi bi-moon"></i>
          </button>
        </div>
      </div>

      <div class="content-wrapper" id="content-wrapper">
        <div id="page-tabs" class="page-tabs mb-3 d-none d-md-flex"></div>
        <!-- Pages rendered by JS -->
      </div>
    </main>
  </div>

  <!-- Bottom Decorative Elements -->
  <img src="assets/img/chibi-butterfly.svg" alt="Butterfly" class="bottom-chibi bottom-butterfly">
  <img src="assets/img/chibi-heart.svg" alt="Heart" class="bottom-chibi bottom-heart">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
