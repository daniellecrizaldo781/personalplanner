<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PersonalPlanner</title>
  <meta name="description" content="Personal productivity dashboard with tasks, notes, meetings, and team cascades">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- Top Decorative Banner -->
  <div class="top-banner">
    <img src="assets/img/chibi-dog.svg" alt="Chibi Dog" class="chibi-sticker chibi-dog">
    <img src="assets/img/chibi-cat.svg" alt="Chibi Cat" class="chibi-sticker chibi-cat">
  </div>

  <div class="app-container">
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title-row">
          <h2 class="sidebar-title">PersonalPlanner</h2>
          <img src="assets/img/chibi-cat.svg" alt="Cat" class="sidebar-chibi" width="32" height="32">
        </div>
        <button class="btn btn-sm sidebar-toggle d-lg-none" id="sidebar-toggle">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="sidebar-nav">
        <a href="#" class="sidebar-link active" data-page="dashboard">
          <i class="bi bi-speedometer2"></i> Dashboard
        </a>
        <a href="#" class="sidebar-link" data-page="tasks">
          <i class="bi bi-clipboard-task"></i> My Tasks
        </a>
        <a href="#" class="sidebar-link" data-page="completed">
          <i class="bi bi-check-circle"></i> Completed Tasks
        </a>
        <a href="#" class="sidebar-link" data-page="notes">
          <i class="bi bi-journal-richtext"></i> Important Notes
        </a>
        <a href="#" class="sidebar-link" data-page="meetings">
          <i class="bi bi-people"></i> Meeting Notes
        </a>
        <a href="#" class="sidebar-link" data-page="cascades">
          <i class="bi bi-megaphone"></i> Team Cascades
        </a>
        <a href="#" class="sidebar-link" data-page="settings">
          <i class="bi bi-gear"></i> Settings
        </a>
      </div>
      <div class="sidebar-footer">
        <button class="btn btn-sm btn-outline-danger w-100" id="export-data-btn">
          <i class="bi bi-download"></i> Export Data
        </button>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <div class="top-bar">
        <div class="d-flex align-items-center">
          <button class="btn btn-sm sidebar-toggle d-lg-none me-3" id="sidebar-open">
            <i class="bi bi-list"></i>
          </button>
          <h1 class="page-title" id="page-title">Dashboard</h1>
        </div>
        <div class="d-flex align-items-center gap-3">
          <div class="position-relative" id="global-search-container">
            <input type="text" class="form-control form-control-sm" id="global-search" placeholder="Global search...">
            <div class="global-search-dropdown" id="global-search-dropdown"></div>
          </div>
          <button class="btn btn-sm btn-outline-secondary" id="theme-toggle">
            <i class="bi bi-moon"></i>
          </button>
        </div>
      </div>

      <div class="content-wrapper" id="content-wrapper">
        <!-- Pages rendered by JS -->
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
