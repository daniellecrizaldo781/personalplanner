services:
  - type: web
    name: personalplanner
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: BASE_URL
        value: https://personalplanner.daniellecrizaldo.com
    # Set these secrets in the Render dashboard:
    # VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, SESSION_SECRET, JWT_SECRET
    disk:
      name: personalplanner-data
      mountPath: /app/data
      sizeGB: 1
